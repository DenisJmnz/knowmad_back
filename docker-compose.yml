services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "5001:5001"
    environment:
      - SERVER_PORT=5001
      - EXTERNAL_API_URL=http://simulado:80
    depends_on:
      - simulado
    networks:
      - backend-network

  # Mock APIs service (required by Backend)
  simulado:
    platform: linux/amd64
    image: ldabiralai/simulado:latest
    container_name: mock-api
    ports:
      - "3001:80"
    volumes:
      - ./simulado:/app
    command: ./bin/simulado -f /app/mocks.json
    networks:
      - backend-network

  # InfluxDB for K6 metrics
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    volumes:
      - influxdb-storage:/var/lib/influxdb
    networks:
      - backend-network

  # Grafana for visualizing metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./dashboards:/etc/grafana/provisioning/dashboards
      - ./datasources:/etc/grafana/provisioning/datasources
      - grafana-storage:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - backend-network

  # K6 load testing (optional - run with: docker-compose run --rm k6)
  k6:
    image: grafana/k6:latest
    container_name: k6-test
    volumes:
      - ./k6:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    networks:
      - backend-network

volumes:
  influxdb-storage:
  grafana-storage:

networks:
  backend-network:
    driver: bridge
